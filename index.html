<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이혼했는데 남편이 돌아왔다</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#151313;color:#f3ece9}
body{font-family:Arial,"Noto Sans KR",sans-serif}

.hero{
  position:relative;
  width:100%;
  min-height:760px;
  height:88vh;
  overflow:hidden;
  background:#151313;
}

/* 앱/웹 공통: 사진을 HERO 전체 배경으로 사용 */
.hero-media{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
}

.hero-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:72% center;
  display:block;
}

/* warm ↔ dark 전환 */
.hero-warm{opacity:1}
.hero-dark{
  opacity:0;
  animation:warmToDark 10s ease-in-out infinite alternate;
}
@keyframes warmToDark{
  0%,30%{opacity:0}
  70%,100%{opacity:1}
}

/* 오른쪽 사진은 살리고 왼쪽으로 넓게 스며드는 블러/페이드 */
.hero-media::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  background:
    linear-gradient(
      135deg,
      rgba(21,19,19,1) 0%,
      rgba(21,19,19,1) 25%,
      rgba(21,19,19,.94) 34%,
      rgba(21,19,19,.78) 42%,
      rgba(21,19,19,.58) 50%,
      rgba(21,19,19,.36) 58%,
      rgba(21,19,19,.18) 66%,
      rgba(21,19,19,.06) 73%,
      rgba(21,19,19,0) 80%
    );
  backdrop-filter:blur(1.5px);
  -webkit-backdrop-filter:blur(1.5px);
}

/* 전체 톤 */
.hero-tone{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:linear-gradient(
    to right,
    rgba(21,19,19,.16) 0%,
    rgba(21,19,19,.10) 38%,
    rgba(21,19,19,.03) 62%,
    rgba(21,19,19,0) 82%
  );
}

/* 하단 연결 */
.hero-bottom-fade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:28%;
  z-index:4;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(21,19,19,0) 0%,
    rgba(21,19,19,.20) 32%,
    rgba(21,19,19,.62) 70%,
    #151313 100%
  );
}

/* 텍스트를 사진 위에 겹침 */
.hero-copy{
  position:absolute;
  left:7%;
  bottom:20%;
  z-index:5;
  width:min(560px,44vw);
  text-shadow:0 2px 16px rgba(0,0,0,.54);
}
.hero-eyebrow,
.story-label{
  margin:0 0 10px;
  font-size:12px;
  font-weight:300;
  letter-spacing:4px;
  color:#d6b6ae;
}
.hero-title{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(38px,4.2vw,66px);
  line-height:1.28;
  font-weight:400;
  letter-spacing:-1px;
  color:#f3ece9;
}
.hero-quote{
  margin:18px 0 0;
  font-size:clamp(16px,1.45vw,22px);
  line-height:1.7;
  color:#eadbd7;
}
.hero-desc{
  margin:14px 0 0;
  font-size:clamp(13px,1.05vw,16px);
  line-height:1.85;
  color:#cbbfbb;
}

/* STORY */
.story{
  background:#151313;
  padding:72px 8% 100px;
}
.story-label{margin-bottom:16px}
.story-title{
  margin:0 0 22px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:32px;
  line-height:1.5;
  font-weight:400;
  color:#f2ebe7;
}
.story-text{
  margin:0;
  max-width:640px;
  font-size:16px;
  line-height:1.95;
  color:#bfb4af;
}

/* 모바일도 같은 구성 유지 */
@media(max-width:720px){
  .hero{
    min-height:620px;
    height:78vh;
  }
  .hero-img{
    object-position:68% center;
  }
  .hero-media::after{
    background:
      linear-gradient(
        135deg,
        rgba(21,19,19,1) 0%,
        rgba(21,19,19,1) 18%,
        rgba(21,19,19,.96) 28%,
        rgba(21,19,19,.82) 38%,
        rgba(21,19,19,.58) 48%,
        rgba(21,19,19,.34) 58%,
        rgba(21,19,19,.16) 68%,
        rgba(21,19,19,0) 78%
      );
  }
  .hero-copy{
    left:7%;
    right:7%;
    bottom:18%;
    width:auto;
  }
  .hero-title{font-size:40px}
  .story{padding:58px 7% 80px}
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-media">
    <img class="hero-img hero-warm" src="./assets/hero-warm.png" alt="">
    <img class="hero-img hero-dark" src="./assets/hero-dark.png" alt="">
  </div>

  <div class="hero-tone"></div>
  <div class="hero-bottom-fade"></div>

  <div class="hero-copy">
    <p class="hero-eyebrow">ORIGINAL STORY BY ALMONDSONGSONG</p>
    <h1 class="hero-title">이혼했는데<br>남편이 돌아왔다</h1>
    <p class="hero-quote">“우리가 끝난 걸<br>당신만 모른다.”</p>
    <p class="hero-desc">이혼 8개월 후,<br>전남편이 사고로 기억을 잃었다.<br>그런데 그는 아직도 나를 아내라고 부른다.</p>
  </div>
</section>

<section class="story">
  <p class="story-label">STORY</p>
  <h2 class="story-title">한 사람에게는 어제였고,<br>한 사람에게는 이미 끝난 사랑.</h2>
  <p class="story-text">
    연애 3년, 결혼 4년.<br>
    우리는 분명 끝났다.<br><br>
    그가 기억하지 못하는 약 3년 동안 우리의 결혼은 서서히 무너졌고,
    결국 서로 다른 길을 선택했다.<br><br>
    그런데 사고 후 다시 만난 그는 우리가 가장 행복했던 시절에 멈춰 있었다.
  </p>
</section>

</body>
</html>
