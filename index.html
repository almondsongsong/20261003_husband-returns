<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이혼했는데 남편이 돌아왔다</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#151313;color:#f3ece9}
body{font-family:Arial,"Noto Sans KR",sans-serif}

.hero{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  min-height:420px;
  overflow:hidden;
  background:#151313;
}

.hero-media{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  overflow:hidden;
}

.hero-main{
  position:absolute;
  top:0;
  right:0;
  width:auto;
  height:100%;
  max-width:none;
  object-fit:contain;
  object-position:right center;
  display:block;

  /* [핵심] 모바일과 PC 모두 동일하게 왼쪽은 투명, 오른쪽으로 갈수록 진해지는 페이드아웃 */
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,1) 65%);
  mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,1) 65%);
}

.hero-feather{
  display:none;
}

.hero-past{
  opacity:1;
  filter: sepia(30%) saturate(120%) brightness(100%);
}

.hero-present{
  opacity:0;
  filter: grayscale(80%) brightness(70%) contrast(120%);
  animation: warmToDark 4s ease-in-out infinite alternate;
}

@keyframes warmToDark{
  0%,30%{opacity:0}
  70%,100%{opacity:1}
}

.hero-tone{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:linear-gradient(
    to right,
    rgba(21,19,19,0.95) 0%,
    rgba(21,19,19,0.5) 45%,
    transparent 100%
  );
}

.hero-bottom-fade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:34%;
  z-index:3;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(21,19,19,.5) 50%,
    #151313 100%
  );
}

.hero-copy{
  position:absolute;
  left:7%;
  bottom:20%;
  z-index:4;
  width:min(520px,48%);
  text-shadow:0 2px 16px rgba(0,0,0,.52);
}

.hero-eyebrow{
  margin:0 0 10px;
  font-size:12px;
  letter-spacing:4px;
  color:#d6b6ae;
}

.hero-title{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(28px,4.6vw,66px);
  line-height:1.28;
  font-weight:400;
  letter-spacing:-1px;
  color:#f3ece9;
}

.hero-quote{
  margin:18px 0 0;
  font-size:clamp(15px,1.5vw,22px);
  line-height:1.7;
  color:#eadbd7;
}

.hero-desc{
  margin:14px 0 0;
  font-size:clamp(12px,1.05vw,16px);
  line-height:1.85;
  color:#cbbfbb;
}

.story{
  background:#151313;
  padding:72px 8% 100px;
}

.story-label{
  margin:0 0 16px;
  font-size:12px;
  letter-spacing:5px;
  color:#aa8e87;
}

.story-title{
  margin:0 0 22px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:32px;
  line-height:1.5;
  font-weight:400;
  color:#f2ebe7;
}

.story-text{
  margin:0;
  max-width:640px;
  font-size:16px;
  line-height:1.95;
  color:#bfb4af;
}

/* 모바일에서도 PC와 동일한 비율 구조 유지 (세로로 찌그러지거나 사진이 밀리지 않음) */
@media(max-width:720px){
  .hero{
    aspect-ratio: 16/10; /* 모바일에서도 가로형 비율을 유지하여 왼쪽 여백과 오른쪽 사진 구조 고정 */
    min-height: 380px;
  }
  .hero-copy{
    left: 6%;
    bottom: 15%;
    width: 52%; /* 텍스트가 왼쪽 영역 안에 예쁘게 들어가도록 고정 */
  }
}
</style>
</head>
<body>

<section class="hero">
  <div class="src-media hero-media">
    <!-- 비교를 위한 같은 사진 & 색감 차이 적용 -->
    <img class="hero-past hero-main" src="./assets/hero-warm.png" alt="">
    <img class="hero-present hero-main" src="./assets/hero-dark.png" alt="">
  </div>

  <div class="hero-tone"></div>
  <div class="hero-bottom-fade"></div>

  <div class="hero-copy">
    <p class="hero-eyebrow">ORIGINAL STORY BY ALMONDSONGSONG</p>
    <h1 class="hero-title">이혼했는데<br>남편이 돌아왔다</h1>
    <p class="hero-quote">“우리가 끝난 걸<br>당신만 모른다.”</p>
    <p class="hero-desc">이혼 8개월 후,<br>전남편이 사고로 기억을 잃었다.<br>그런데 그는 아직도 나를 아내라고 부른다.</p>
  </div>
</section>

<section class="story">
  <p class="story-label">STORY</p>
  <h2 class="story-title">한 사람에게는 어제였고,<br>한 사람에게는 이미 끝난 사랑.</h2>
  <p class="story-text">
    연애 3년, 결혼 4년.<br>
    우리는 분명 끝났다.<br><br>
    그가 기억하지 못하는 약 3년 동안 우리의 결혼은 서서히 무너졌고,
    결국 서로 다른 길을 선택했다.<br><br>
    그런데 사고 후 다시 만난 그는 우리가 가장 행복했던 시절에 멈춰 있었다.
  </p>
</section>

</body>
</html>
