<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이혼했는데 남편이 돌아왔다</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#151313;color:#f3ece9}
body{font-family:Arial,"Noto Sans KR",sans-serif}
.hero{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  min-height:420px;
  overflow:hidden;
  background:#151313;
}
.hero img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.hero-past{
  z-index:0;
}
.hero-present{
  z-index:1;
  -webkit-mask-image:linear-gradient(
    to right,
    transparent 7%,
    rgba(0,0,0,.04) 20%,
    rgba(0,0,0,.14) 32%,
    rgba(0,0,0,.34) 45%,
    rgba(0,0,0,.58) 58%,
    rgba(0,0,0,.80) 72%,
    #000 88%
  );
  mask-image:linear-gradient(
    to right,
    transparent 7%,
    rgba(0,0,0,.04) 20%,
    rgba(0,0,0,.14) 32%,
    rgba(0,0,0,.34) 45%,
    rgba(0,0,0,.58) 58%,
    rgba(0,0,0,.80) 72%,
    #000 88%
  );
}
.hero-tone{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    linear-gradient(
      to right,
      rgba(12,8,7,.08) 0%,
      rgba(12,8,7,.06) 32%,
      rgba(10,10,12,.14) 58%,
      rgba(8,9,12,.34) 100%
    );
}
.hero-left-shade{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:58%;
  z-index:2;
  pointer-events:none;
  background:linear-gradient(
    to right,
    rgba(10,8,8,.34) 0%,
    rgba(10,8,8,.15) 50%,
    transparent 100%
  );
}
.hero-bottom-fade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:34%;
  z-index:3;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(21,19,19,0) 0%,
    rgba(21,19,19,.18) 28%,
    rgba(21,19,19,.55) 65%,
    #151313 100%
  );
}
.hero-copy{
  position:absolute;
  left:7%;
  bottom:13%;
  z-index:4;
  width:min(520px,48%);
  text-shadow:0 2px 16px rgba(0,0,0,.52);
}
.hero-eyebrow{
  margin:0 0 10px;
  font-size:12px;
  letter-spacing:4px;
  color:#d6b6ae;
}
.hero-title{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(32px,4.6vw,66px);
  line-height:1.28;
  font-weight:400;
  letter-spacing:-1px;
  color:#f3ece9;
}
.hero-quote{
  margin:18px 0 0;
  font-size:clamp(16px,1.5vw,22px);
  line-height:1.7;
  color:#eadbd7;
}
.hero-desc{
  margin:14px 0 0;
  font-size:clamp(13px,1.05vw,16px);
  line-height:1.85;
  color:#cbbfbb;
}
.story{
  background:#151313;
  padding:72px 8% 100px;
}
.story-label{
  margin:0 0 16px;
  font-size:12px;
  letter-spacing:5px;
  color:#aa8e87;
}
.story-title{
  margin:0 0 22px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:32px;
  line-height:1.5;
  font-weight:400;
  color:#f2ebe7;
}
.story-text{
  margin:0;
  max-width:640px;
  font-size:16px;
  line-height:1.95;
  color:#bfb4af;
}
@media(max-width:720px){
  .hero{
    aspect-ratio:auto;
    height:72vh;
    min-height:560px;
  }
  .hero img{object-position:center}
  .hero-copy{
    left:7%;
    right:7%;
    bottom:10%;
    width:auto;
  }
  .hero-title{font-size:40px}
  .story{padding:58px 7% 80px}
}
</style>
</head>
<body>

<section class="hero">
  <img class="hero-past" src="./assets/hero-warm.png" alt="">
  <img class="hero-present" src="./assets/hero-dark.png" alt="">

  <div class="hero-tone"></div>
  <div class="hero-left-shade"></div>
  <div class="hero-bottom-fade"></div>

  <div class="hero-copy">
    <p class="hero-eyebrow">ORIGINAL STORY BY ALMONDSONGSONG</p>
    <h1 class="hero-title">이혼했는데<br>남편이 돌아왔다</h1>
    <p class="hero-quote">“우리가 끝난 걸<br>당신만 모른다.”</p>
    <p class="hero-desc">이혼 8개월 후,<br>전남편이 사고로 기억을 잃었다.<br>그런데 그는 아직도 나를 아내라고 부른다.</p>
  </div>
</section>

<section class="story">
  <p class="story-label">STORY</p>
  <h2 class="story-title">한 사람에게는 어제였고,<br>한 사람에게는 이미 끝난 사랑.</h2>
  <p class="story-text">
    연애 3년, 결혼 4년.<br>
    우리는 분명 끝났다.<br><br>
    그가 기억하지 못하는 약 3년 동안 우리의 결혼은 서서히 무너졌고,
    결국 서로 다른 길을 선택했다.<br><br>
    그런데 사고 후 다시 만난 그는 우리가 가장 행복했던 시절에 멈춰 있었다.
  </p>
</section>

</body>
</html>
